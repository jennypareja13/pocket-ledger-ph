name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, type-check, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Print formatted PR D source files
        run: |
          bunx prettier --write src/lib/privacy-consent.ts src/components/app/PrivacyConsentGate.tsx src/routes/_shell.tsx src/routes/auth.tsx src/routes/reset-password.tsx src/test/pr-d-consent-password-reset.test.ts
          for file in src/lib/privacy-consent.ts src/components/app/PrivacyConsentGate.tsx src/routes/_shell.tsx src/routes/auth.tsx src/routes/reset-password.tsx src/test/pr-d-consent-password-reset.test.ts; do
            echo "----- BEGIN $file -----"
            cat "$file"
            echo "----- END $file -----"
          done
          git diff --exit-code -- src/lib/privacy-consent.ts src/components/app/PrivacyConsentGate.tsx src/routes/_shell.tsx src/routes/auth.tsx src/routes/reset-password.tsx src/test/pr-d-consent-password-reset.test.ts

      - name: Run lint
        run: bun run lint

      - name: Run TypeScript type-check
        run: bunx tsc --noEmit

      - name: Build production app
        run: bun run build

      - name: Verify generated route tree is committed
        run: |
          git diff -- src/routeTree.gen.ts | tee /tmp/route-tree.diff
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::error::TanStack generated route tree differs from the committed file. Copy the generated diff into the commit."
            exit 1
          fi

      - name: Verify production route entry fingerprints
        run: node scripts/verify-offline-build.mjs
