name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, type-check, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dependency security audit (non-blocking)
        run: |
          set +e
          bun audit
          audit_status=$?
          if [ "$audit_status" -ne 0 ]; then
            echo "::warning::bun audit reported vulnerabilities or could not complete (exit ${audit_status}); review the audit output above."
          fi
          exit 0

      - name: Run tests
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Build production app
        run: bun run build

      - name: Verify generated route tree is committed
        run: |
          git diff -- src/routeTree.gen.ts | tee /tmp/route-tree.diff
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::error::TanStack generated route tree differs from the committed file. Copy the generated diff into the commit."
            exit 1
          fi

      - name: Run TypeScript type-check
        run: bunx tsc --noEmit

      - name: Verify production route entry fingerprints
        run: node scripts/verify-offline-build.mjs
