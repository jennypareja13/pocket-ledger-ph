name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, type-check, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Format PR G files for review
        run: |
          files="public/sw.js src/lib/service-worker.ts src/components/app/ServiceWorkerUpdatePrompt.tsx src/test/service-worker-runtime.test.ts src/test/service-worker-registration.test.ts scripts/verify-offline-build.mjs"
          bunx prettier --write $files
          for file in $files; do
            echo "PRG_FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "PRG_FORMAT_END:$file"
          done

      - name: Run lint
        run: bun run lint

      - name: Run TypeScript type-check
        run: bunx tsc --noEmit

      - name: Build production app
        run: bun run build

      - name: Inspect production route manifest
        run: |
          find .output node_modules/.nitro/vite/services/ssr/assets -type f -iname '*manifest*' -print
          for file in $(find .output node_modules/.nitro/vite/services/ssr/assets -type f -iname '*manifest*'); do
            echo "PRG_MANIFEST_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "PRG_MANIFEST_END:$file"
          done

      - name: Verify production route entry fingerprints
        run: node scripts/verify-offline-build.mjs
